- id: onlyfans
  name: OnlyFans
  type: fan_platform
  ai_creator_friendliness_score: null
  monetization_score: null
  automation_score: null
  discovery_score: null
  policy_risk: high
  notes:
    - Major fan monetization platform, but pure synthetic AI model and AI girlfriend operations need stricter identity, disclosure, consent, and account-review controls than Fanvue.
    - OnlyFans Terms of Service state that AI Generated Content must comply with the Terms and be clearly and conspicuously captioned as AI Generated Content with a signifier such as #ai or #AIGenerated.
    - OnlyFans Help says creators can share content generated, altered, or enhanced by AI only if it clearly features the verified Creator and users can tell the content was generated, altered, or enhanced by AI.
    - OnlyFans Acceptable Use Policy is the primary content-risk layer for synthetic creators because adult, likeness, consent, age, and prohibited-content issues can trigger content or account deactivation.
    - OnlyFans Terms list the platform fee as 20% of total Fan Payments, meaning creator earnings are the remaining share before any additional payout/payment conditions.
    - For AI influencer or AI companion operators, OnlyFans should be treated as high-risk unless the account is built around a verified creator, transparent AI labeling, and documented rights to the underlying likeness and media.
  sources:
    - onlyfans-terms
    - onlyfans-help-ai-content
    - onlyfans-acceptable-use-policy
  last_checked: '2026-05-18'
