- id: tiktok-shop
  name: TikTok Shop
  type: commerce_platform
  ai_creator_friendliness_score: null
  monetization_score: null
  automation_score: null
  discovery_score: null
  policy_risk: medium
  notes:
    - Commerce and affiliate rail for AI creator operators who can make product-led videos or LIVEs without misleading viewers about identity, product results, or endorsements.
    - TikTok Shop Creator guidance describes Affiliate Creators as creators who promote products through shoppable videos, LIVEs, and affiliate links and earn commissions from generated orders.
    - US TikTok Shop Creator guidance lists general eligibility requirements including being at least 18, based in the United States, not a government/political account, policy compliance, no prior e-commerce-permission revocation, and creator identity verification where applicable.
    - The same TikTok Shop Creator guidance lists follower thresholds by account type, including 1,000+ followers for Affiliate Creators and 5,000+ followers for Marketing Creators promoting other sellers' marketplace products.
    - TikTok Shop Content Policy says AI-generated content is not allowed if it misleads or deceives viewers, impersonates others, or violates TikTok Shop Content Policy or TikTok Community Guidelines.
    - TikTok Shop creator accounts can face e-commerce permission loss, Creator Health Rating impact, and shoppable content limits for policy violations, so AI model/virtual creator workflows need product-claim QA before posting.
  sources:
    - tiktok-shop-before-becoming-creator
    - tiktok-shop-content-policy
    - tiktok-shop-creator-eligibility-policy
    - tiktok-shop-creator-health-rating
