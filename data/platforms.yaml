- id: fanvue
  name: Fanvue
  type: fan_platform
  ai_creator_friendliness_score: null
  monetization_score: null
  automation_score: null
  discovery_score: null
  policy_risk: medium
  notes:
    - Fan platform with unusually explicit AI creator support; still requires disclosure, provenance controls, age-appearance review, copyright care, and verified real-person handling when a real body or face is involved.
    - Fanvue's Help Centre says it welcomes AI creators and allows fully AI-generated content, while requiring clear disclosure that AI-generated media is not real and was generated using AI.
    - Fanvue says deepfaked or face-swapped content is allowed only when the real model behind the AI is verified, and its AI-generated model help article says a model using a real person's body is classed as a real model requiring KYC.
    - Fanvue's AI-content rules prohibit harmful or misleading AI media, content resembling or intending to resemble someone under 18, copyright infringement, and AI media of a real person other than the account owner.
    - Fanvue's creator earnings policy lists a standard creator earning rate of 80% of gross revenue from paid-for services, with Fanvue retaining 20% as platform fees unless otherwise agreed.
    - Fanvue's creator help documents a first-time payout workflow requiring available balance threshold, at least five uploaded content pieces, and verification of co-creators featured in content; regional withdrawal thresholds may vary.
  sources:
    - fanvue-ai-content-allowed
    - fanvue-ai-generated-content
    - fanvue-ai-generated-model-definition
    - fanvue-creator-earnings-payouts
    - fanvue-receive-payout-help
