  policy_risk: medium
  notes:
    - Discovery engine for motion-first synthetic creator content; TikTok Shop/affiliate eligibility needs separate review.
    - Official Content Posting API supports direct video/photo posting and draft upload workflows, but unaudited clients are restricted to private viewing mode until app audit approval.
