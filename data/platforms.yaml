- id: youtube-shorts
  name: YouTube Shorts
  type: social_platform
  ai_creator_friendliness_score: null
  monetization_score: null
  automation_score: null
  discovery_score: null
  policy_risk: medium
  notes:
    - Short-form distribution surface for public-safe creator lore, educational explainers, and brand-building clips.
    - YouTube requires creators to disclose meaningfully altered or synthetically generated content when it seems realistic, including realistic depictions of people, places, events, or speech that did not occur.
    - Official YouTube Data API upload support exists through videos.insert, with OAuth scopes, a 100-unit quota cost per upload call, and writable metadata including status.containsSyntheticMedia.
    - YouTube Data API projects receive a default daily quota allocation, while additional quota requires a compliance audit; high-volume AI creator upload workflows should plan for quota and policy review.
    - Shorts monetization is available to monetizing partners that accept the Shorts Monetization Module, but eligible views and payout depend on broader YouTube monetization and advertiser-friendly policies.
    - Monetization risk is elevated for templated, repetitive, mass-produced, or reused AI videos that lack original/authentic substance, even if use of AI itself is not automatically disqualifying.
  sources:
    - youtube-help-altered-synthetic-content
    - youtube-data-api-videos-insert
    - youtube-api-quota-compliance-audits
    - youtube-shorts-monetization-policies
    - youtube-channel-monetization-policies
  last_checked: '2026-05-18'
- id: x-twitter
  name: X / Twitter
  type: social_platform
  ai_creator_friendliness_score: null
  monetization_score: null
  automation_score: null
  discovery_score: null
  policy_risk: medium
  notes:
    - Conversation and distribution surface for AI influencer, virtual influencer, AI model, and AI companion brands, with stronger official API support than many social platforms but meaningful spam and monetization risk.
    - X API v2 supports creating or editing posts through POST /2/tweets, including fields for made_with_ai and paid_partnership labeling when applicable.
    - X API v2 supports media upload for posts and other content through the official media upload endpoint; automation should use official API access rather than scraping or browser automation.
    - X Developer Guidelines emphasize user-initiated, transparent, opt-out-capable automation; identical content across multiple accounts, trend manipulation, unsolicited auto-replies, unsolicited bulk DMs, and engagement-selling patterns are prohibited or high risk.
    - X Creator Revenue Sharing requires Premium/Premium Business/Premium Organizations, 5M organic impressions in the last three months, 500 verified followers, a supported payout country, and compliance with X rules and agreements.
    - X Creator Revenue Sharing states payouts are currently processed every two weeks with a $30 minimum, but X may modify, cancel, accept, or revoke participation at its discretion.
    - X states that effective March 3, 2026, users who post AI-generated videos of armed conflict without disclosure are suspended from Creator Revenue Sharing for 90 days, with subsequent violations causing permanent payment suspension.
  sources:
    - x-api-create-post
    - x-api-media-upload
    - x-developer-guidelines
    - x-creator-revenue-sharing
